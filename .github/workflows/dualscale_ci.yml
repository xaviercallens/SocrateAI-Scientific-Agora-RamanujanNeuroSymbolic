name: DualScale CI Gate

on:
  pull_request:
    paths:
      - "dualscale/**"
  push:
    branches:
      - main
    paths:
      - "dualscale/**"

jobs:
  audit:
    name: Full Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install numpy

      # ──────────────────────────────────────────────────────────────────
      # Step 1: Lean audit — reject axioms, vacuous goals; report sorry
      # ──────────────────────────────────────────────────────────────────
      - name: Audit Lean files (formalization)
        run: python dualscale/ci/audit_lean.py --root dualscale/lean

      # ──────────────────────────────────────────────────────────────────
      # Step 2: v1 regression — the withdrawn listings MUST still fail
      # ──────────────────────────────────────────────────────────────────
      - name: Audit Lean files (v1 regression — must FAIL)
        run: |
          python dualscale/ci/audit_lean.py --root dualscale/paper/errata
          # Invert: the above must exit non-zero
        continue-on-error: true
        id: v1_regression
      - name: Verify v1 regression correctly fails
        run: |
          if [ "${{ steps.v1_regression.outcome }}" == "success" ]; then
            echo "ERROR: v1 vacuous listings passed audit — audit_lean.py is broken!"
            exit 1
          fi
          echo "OK: v1 vacuous listings correctly rejected."

      # ──────────────────────────────────────────────────────────────────
      # Step 3: Validate refs/values.json (Rule R5)
      # ──────────────────────────────────────────────────────────────────
      - name: Validate literature references
        run: python dualscale/ci/validate_refs.py

      # ──────────────────────────────────────────────────────────────────
      # Step 4: Re-run certificates and validate against ledger
      # ──────────────────────────────────────────────────────────────────
      - name: Re-run spectral certificates
        run: |
          python dualscale/numerics/spectral/build_triad_graph.py
          python dualscale/numerics/spectral/check_alon_boppana.py
          python dualscale/numerics/elliptic/cfm_elliptic_angle.py
          python dualscale/numerics/moduli/s12_reclassification.py
      - name: Validate certificate schema
        run: python dualscale/ci/run_certificates.py

      # ──────────────────────────────────────────────────────────────────
      # Step 5: Citation audit (Tier-B claims must have cite keys)
      # ──────────────────────────────────────────────────────────────────
      - name: Audit citations in paper
        run: |
          python dualscale/ci/audit_citations.py \
            --paper-dir docs/v2.1_paper \
            --bib dualscale/refs/bib/dualscale.bib

      # ──────────────────────────────────────────────────────────────────
      # Step 6: Compile v2.1 LaTeX Paper
      # ──────────────────────────────────────────────────────────────────
      - name: Compile LaTeX Paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: socrateai_dualscale_v2.tex
          working_directory: docs/v2.1_paper
          
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualscale_v2_1_paper
          path: docs/v2.1_paper/socrateai_dualscale_v2.pdf

      # ──────────────────────────────────────────────────────────────────
      # Summary
      # ──────────────────────────────────────────────────────────────────
      - name: Print final ledger
        if: always()
        run: cat dualscale/certificates/*ledger*.csv
