steps:
  # Build the GPU image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rama-gpu:$SHORT_SHA'
      - '-f'
      - 'Dockerfile.rama-gpu'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rama-gpu:$SHORT_SHA'

  # Deploy to Cloud Run (T4 GPU instance)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'create'
      - 'rama-deep-burn'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rama-gpu:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--task-count'
      - '1'
      - '--parallelism'
      - '1'
      - '--max-retries'
      - '3'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--set-env-vars'
      - 'EPOCHS=500,POP_SIZE=5000000,GCS_BUCKET_NAME=rama-gpu-results'

images:
  - 'gcr.io/$PROJECT_ID/rama-gpu:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
